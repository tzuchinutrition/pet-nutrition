<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 寵物營養 AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f7f7f7;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
}

input, select {
    padding: 6px;
    margin: 5px 0;
}

button {
    padding: 8px 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
}

.dm-gap-hint {
    font-size: 0.8rem;
    color: #b8860b;
    margin-top: 5px;
}

.dm-gap-hint.ok {
    color: green;
}
</style>
</head>

<body>

<h2>🐾 寵物營養 AI Demo</h2>

<div class="card">
    體重 (kg):
    <input id="weight" value="10">

    <br>

    模式:
    <select id="mealMode">
        <option value="daily">每日</option>
        <option value="meal">一餐</option>
    </select>

    <br>

    <button onclick="calcDER()">計算 DER</button>

    <div>DER: <span id="derVal">0</span></div>
</div>

<div class="card" id="achieveContent">

    <div class="nutr-row">
        <div class="nutr-row-ach">
            <div class="ach-actual">實際 40</div>
            <div class="ach-ref">≥ 60 mg</div>
        </div>
    </div>

    <div class="nutr-row">
        <div class="nutr-row-ach">
            <div class="ach-actual">實際 80</div>
            <div class="ach-ref">≥ 60 mg</div>
        </div>
    </div>

</div>

<script>
function calcDER() {
    const w = parseFloat(document.getElementById('weight').value);
    const der = w * 70;
    document.getElementById('derVal').innerText = der.toFixed(0);
    updateSupplementHints();
}

function updateSupplementHints() {
    const currentDER = parseFloat(document.getElementById('derVal').innerText) || 0;
    const mealMode = document.getElementById('mealMode').value;

    const E = (mealMode === 'meal') ? (currentDER / 2) : currentDER;
    if (E === 0) return;

    const rows = document.querySelectorAll('.nutr-row');

    rows.forEach(row => {
        const actual = parseFloat(row.querySelector('.ach-actual').innerText.match(/[0-9.]+/)[0]);
        const ref = parseFloat(row.querySelector('.ach-ref').innerText.match(/[0-9.]+/)[0]);
        const unit = row.querySelector('.ach-ref').innerText.match(/[a-zA-Z]+/)[0];

        const gap = ref - actual;

        let hint = row.querySelector('.dm-gap-hint');
        if (!hint) {
            hint = document.createElement('div');
            row.appendChild(hint);
        }

        if (gap > 0) {
            const need = gap * (E / 1000);
            hint.className = 'dm-gap-hint';
            hint.innerText = `💡 建議補給：${need.toFixed(1)} ${unit}`;
        } else {
            hint.className = 'dm-gap-hint ok';
            hint.innerText = `✅ 密度達標`;
        }
    });
}

document.getElementById('mealMode').addEventListener('change', updateSupplementHints);
</script>

</body>
</html>
